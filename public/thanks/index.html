<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message sent | Blacktide Software</title>
  <meta name="description" content="Thanks for contacting Blacktide Software.">
  <meta name="theme-color" content="#0b1724">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>html, body { margin: 0; padding: 0; background: #0b1724; }</style>
  <style>
    .bt {
      --bt-ink: #0b1724;
      --bt-panel: #132b44;
      --bt-line: rgba(255, 255, 255, 0.10);
      --bt-text: #e8eef5;
      --bt-muted: #9fb2c6;
      --bt-accent: #3fc1c9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--bt-text);
      background: var(--bt-ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .bt *, .bt *::before, .bt *::after { box-sizing: border-box; }
    .bt h1, .bt h2, .bt p, .bt ul { margin: 0; color: inherit; font-family: inherit; letter-spacing: normal; text-transform: none; }
    .bt a { color: var(--bt-accent); text-decoration: none; }
    .bt a:hover { text-decoration: underline; }
    .bt-wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
    .bt-nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; max-width: 1080px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
    .bt-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--bt-text) !important; }
    .bt-logo:hover { text-decoration: none !important; }
    .bt-logo svg { width: 30px; height: 30px; flex: none; }
    .bt-back { font-size: 15px; font-weight: 600; color: var(--bt-text) !important; }
    .bt-doc { padding: 48px 0 80px; }
    .bt-doc h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.15; font-weight: 800; margin-bottom: 8px; }
    .bt-date { color: var(--bt-muted); font-size: 15px; margin-bottom: 36px !important; }
    .bt-doc h2 { font-size: 21px; font-weight: 700; margin: 36px 0 10px; }
    .bt-doc p { color: var(--bt-muted); font-size: 16.5px; margin-bottom: 14px; }
    .bt-doc ul { color: var(--bt-muted); font-size: 16.5px; padding-left: 22px; margin-bottom: 14px; }
    .bt-doc li { margin: 6px 0; }
    .bt-doc strong { color: var(--bt-text); }
    .bt-callout { background: var(--bt-panel); border: 1px solid var(--bt-line); border-left: 3px solid var(--bt-accent); border-radius: 10px; padding: 18px 20px; margin: 18px 0; }
    .bt-callout p { margin: 0; color: var(--bt-text); }
    .bt-foot { border-top: 1px solid var(--bt-line); padding: 28px 0; color: var(--bt-muted); font-size: 14px; }
    .bt-foot .bt-wrap { max-width: 1080px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
    .bt-foot-links { display: flex; gap: 20px; }
    .bt-foot-links a { color: var(--bt-text); text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 600px) {
      .bt-wrap, .bt-nav { padding-left: 16px; padding-right: 16px; }
      .bt-doc { padding: 32px 0 60px; }
    }
  </style>
</head>
<body>
<div class="bt">

  <nav class="bt-nav">
    <a class="bt-logo" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#3fc1c9"/>
        <path d="M5 19c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 4 3" fill="none" stroke="#0b1724" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M5 24c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 4 3" fill="none" stroke="#0b1724" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
      </svg>
      Blacktide Software
    </a>
    <a class="bt-back" href="/">&larr; Back to home</a>
  </nav>

  <main class="bt-doc">
    <div class="bt-wrap">
      <h1>Thanks, we got your message.</h1>
      <p>We'll get back to you by email, usually within one business day.</p>
      <p><a href="/">&larr; Back to home</a></p>
    </div>
  </main>

  <footer class="bt-foot">
    <div class="bt-wrap">
      <span>&copy; 2026 Blacktide Software LLC &middot; Brandon, Florida</span>
      <span class="bt-foot-links">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </span>
    </div>
  </footer>

</div>
</body>
</html>
